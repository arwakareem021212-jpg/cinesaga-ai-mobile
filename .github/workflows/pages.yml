name: Publish reviewed CineSaga PWA
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinesaga-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'arwakareem021212-jpg/cinesaga-ai-mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify exact reviewed static files
        shell: bash
        run: |
          test -z "$(find site -type l -print)"
          test "$(find site -type f | wc -l)" -eq 58
          sha256sum --check site-sha256.txt
          find site -type f | LC_ALL=C sort > /tmp/actual-files
          cut -c67- site-sha256.txt | LC_ALL=C sort > /tmp/reviewed-files
          diff -u /tmp/reviewed-files /tmp/actual-files
      - name: Upload public site only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1

  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
